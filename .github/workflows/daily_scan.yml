name: Daily Stock Scan Notification

on:
  schedule:
    # 00:00 UTC = 07:00 AM Thailand (Summary Phase - Morning scan after US market close)
    - cron: '0 0 * * 1-5'
    # 13:00 UTC = 20:00 PM Thailand (Planning Phase - Pre-market radar before US open)
    - cron: '0 13 * * 1-5'
    # 16:00 UTC = 23:00 PM Thailand (Trading Phase - Active market session)
    - cron: '0 16 * * 1-5'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stock Scanner & Send Discord Notification
        run: |
          python scan_stocks.py
